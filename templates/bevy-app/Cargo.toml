[package]
name = "oxydroid-bevy-app"
version = "0.1.0"
edition = "2024"
publish = false

# Starter: a Bevy app on Android (NativeActivity) with a working soft keyboard.
#   cargo apk build --lib        (or: cargo apk run --lib, with a device connected)
# Make your own copy with:  templates/new-app.sh bevy my-app

[lib]
crate-type = ["cdylib"]

[dependencies]
oxydroid-bevy = { path = "../../bevy" }
# 2d + ui (TextInput lives in bevy_ui_widgets). Pick exactly ONE Android backend: native-activity
# is the one oxydroid supports (no Java/Gradle build needed). system_font_discovery: the phone's
# own fonts (Roboto + fallbacks for accents, Arabic, emoji); Bevy's built-in font is ASCII-only.
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "android-native-activity", "system_font_discovery"] }
log = "0.4"

[package.metadata.android]
package = "dev.kotbyte.oxydroid.bevyapp"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]   # phones + emulator

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "oxydroid bevy app"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode|fontScale|density"

[profile.dev]
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
