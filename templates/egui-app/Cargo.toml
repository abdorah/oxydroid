[package]
name = "oxydroid-egui-app"
version = "0.1.0"
edition = "2024"
publish = false

# Starter: an egui (eframe) app on Android (NativeActivity) with a working soft keyboard.
#   cargo apk build --lib        (or: cargo apk run --lib, with a device connected)
# Make your own copy with:  templates/new-app.sh egui my-app

[lib]
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
oxydroid = { path = "../..", features = ["egui"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
egui = "0.37.0"
# The phone's emoji font is a color bitmap font: needs epaint's color glyph rasterizer.
epaint = { version = "0.37.0", features = ["color_fonts"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = "0.30.13"

[package.metadata.android]
package = "dev.kotbyte.oxydroid.eguiapp"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]   # phones + emulator

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "oxydroid egui app"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode|fontScale|density"

[profile.dev]
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
